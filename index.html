<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#1a1245"><title>Cerebro Loco Remaster</title>
<link rel="stylesheet" href="./game.css?v=15"><link rel="manifest" href="./app.webmanifest">
</head><body>
<main class="app">
<section class="screen art active" id="onboarding-age"><div class="stage"><img src="ui-age.webp" alt="" draggable="false"><div class="agenum" id="ageNum">13</div><div id="ageHits"></div></div></section>
<section class="screen art" id="onboarding-name"><div class="stage"><img src="ui-name.webp" alt="" draggable="false"><input id="inputName" type="text" maxlength="14" autocomplete="off" aria-label="Tu nombre"><div id="nameHits"></div></div></section>
<section class="screen art" id="home"><div class="stage"><img src="ui-home.webp" alt="" draggable="false"><div class="xpw"><i id="xpFill"></i></div><div id="homeHits"></div></div></section>
<section class="screen" id="levels"><div class="top"><button class="back" id="backHome"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Volver</button><span class="chip">💡 <b id="coinsLevels">0</b></span></div>
<h2>Misiones</h2><p class="sub" id="mapCount"></p><div class="level-grid" id="levelGrid"></div></section>
<section class="screen" id="game"><div class="stage" id="stage"><img id="bg" alt="" draggable="false">
<i class="cn" id="coinNum">50</i><div id="hots"></div><button class="hb" id="pauseBtn" aria-label="Pausa"></button><button class="hb" id="hintBtn" aria-label="Pista"></button>
<button class="hb" id="giftBtn" aria-label="Regalo"></button><button class="hb" id="focosBtn" aria-label="Focos"></button>
<div class="say" id="say"></div><div class="card" id="card"></div></div></section></main>
<div class="rotate"><b>Gira tu dispositivo</b><span>Se juega en horizontal.</span></div>
<div class="modal" id="winModal"><div class="mcard"><div class="trophy">★</div><h2>¡Mente brillante!</h2><b id="winReward">+10 focos</b><p id="winText"></p>
<button class="btn" id="nextBtn">Siguiente →</button><button class="btn alt" id="mapBtn">Misiones</button></div></div>
<div class="modal" id="pauseModal"><div class="mcard"><h2>Pausa</h2><button class="btn" id="resumeBtn">Continuar</button><button class="btn alt" id="retryBtn">Reiniciar misión</button><button class="btn ghost" id="musicBtn2"></button><button class="btn skip" id="skipBtn">Saltar misión · 75 focos</button><button class="btn ghost" id="exitBtn">Salir al mapa</button></div></div>
<div class="modal" id="coinsModal"><div class="nf"><button class="nfx" id="coinsX" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></svg></button>
<svg class="nfb1" viewBox="0 0 64 64"><path d="M32 4a18 18 0 0 0-10 33v8h20v-8A18 18 0 0 0 32 4z" fill="#ffd23c" stroke="#d98a00" stroke-width="2.5"/><rect x="23" y="47" width="18" height="7" rx="2" fill="#bfe3ff" stroke="#3b7bd8" stroke-width="2"/><path d="M52 8l5-4M56 18l6-1M10 8L5 4" stroke="#ffd23c" stroke-width="3.5" stroke-linecap="round"/></svg>
<div class="nft">¡Sin focos!</div><p>Mira un anuncio para obtener <b>25</b> focos</p>
<div class="nfr"><button class="nb1" id="coinsClose">Cerrar</button><button class="nb2" id="coinsAd"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#fff"/></svg>Ver Anuncio</button></div></div></div>
<div class="modal" id="setModal"><div class="mcard"><h2>Ajustes</h2><button class="btn ghost" id="musicBtn"></button><button class="btn ghost" id="renameBtn">Cambiar nombre</button><button class="btn" id="setClose">Cerrar</button></div></div>
<div class="modal" id="statModal"><div class="mcard"><h2>Tu progreso</h2><p id="statText"></p><button class="btn" id="statClose">Cerrar</button></div></div>
<div class="toast" id="toast"></div><script src="./game.js?v=15" defer></script></body></html>
