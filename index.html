<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#1a1245"><title>Cerebro Loco Remaster</title>
<link rel="stylesheet" href="./game.css?v=16"><link rel="manifest" href="./app.webmanifest">
</head><body>
<main class="app">
<section class="screen art active" id="onboarding-age"><div class="stage"><img src="ui-age.webp" alt="" draggable="false"><div class="agenum" id="ageNum">13</div><div id="ageHits"></div></div></section>
<section class="screen art" id="onboarding-name"><div class="stage"><img src="ui-name.webp" alt="" draggable="false"><input id="inputName" type="text" maxlength="14" autocomplete="off" aria-label="Tu nombre"><div id="nameHits"></div></div></section>
<section class="screen art" id="home"><div class="stage"><img src="ui-home.webp" alt="" draggable="false"><div class="xpw"><i id="xpFill"></i></div><div id="homeHits"></div></div></section>
<section class="screen" id="levels"></section>
<section class="screen" id="game"><div class="stage" id="stage"><img id="bg" alt="" draggable="false">
<i class="cn" id="coinNum">50</i><div id="hots"></div><button class="hb" id="pauseBtn" aria-label="Pausa"></button><button class="hb" id="hintBtn" aria-label="Pista"></button>
<button class="hb" id="giftBtn" aria-label="Regalo"></button><button class="hb" id="focosBtn" aria-label="Focos"></button>
<div class="say" id="say"></div><div class="card" id="card"></div></div></section></main>
<div class="rotate"><b>Gira tu dispositivo</b><span>Se juega en horizontal.</span></div>
<div class="toast" id="toast"></div><script src="./game.js?v=16" defer></script></body></html>
