<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1c">
<title>Cerebro Loco — Desafíos mentales</title>
<link rel="stylesheet" href="./game.css">
<script src="https://playgama.com/ads/v0.3.js?clid=p_8cd46aa6-cc31-4149-bb34-5f754a653358"></script>
</head>
<body>

<main class="app">
<!-- REGISTRO -->
<section class="screen active" id="onboarding">
  <div class="brand">
    <h1 class="title-elegant">CEREBRO<br><span>LOCO</span></h1>
    <p class="subtitle">Ingresa tus datos para comenzar la misión.</p>
  </div>
  <div class="register-box">
    <label>¿Cuál es tu edad?</label>
    <input type="number" id="inputAge" placeholder="Ej. 15" min="5" max="99" required>
    <label>¿Cómo te llamas?</label>
    <input type="text" id="inputName" placeholder="Tu nombre" required>
    <button class="primary" id="saveProfileBtn" style="margin-top:15px;">COMENZAR ➜</button>
  </div>
</section>

<!-- MENÚ -->
<section class="screen" id="home">
  <div class="top"><div class="pill" id="userGreeting">HOLA</div><div class="pill"><b id="coinsHome">0</b> FOCOS</div></div>
  <div class="brand" style="flex: 0.4;">
    <h1 class="title-elegant">CEREBRO<br><span>LOCO</span></h1>
  </div>
  <div class="menu-actions">
    <button class="primary" id="playBtn">JUGAR AHORA</button>
    <button class="secondary" id="levelsBtn">VER NIVELES</button>
    <button class="secondary" id="rewardAdBtn" style="background:#1e2c4f;color:#a0b8e0;border:1px solid #3b5998;">VER ANUNCIO · +25 FOCOS</button>
  </div>
  <div class="stats"><div class="stat">Nivel <b id="homeProgress">1</b></div><div class="stat"><b id="homeStars">0</b> completados</div></div>
</section>

<!-- MAPA -->
<section class="screen" id="levels">
  <div class="top"><button class="iconbtn" id="backHome">←</button><div class="pill"><b id="coinsLevels">0</b> FOCOS</div></div>
  <h2 class="heading">Mapa de desafíos</h2>
  <div class="progress"><i id="mapProgress"></i></div><div class="level-grid" id="levelGrid"></div>
</section>

<!-- JUEGO -->
<section class="screen" id="game">
  <div class="top game-top"><button class="iconbtn" id="backLevels">←</button><div class="pill" id="levelLabel">NIVEL 1</div><div class="pill"><b id="coinsGame">0</b> FOCOS</div></div>
  
  <!-- AQUÍ VA EL CANVAS DEL JUEGO -->
  <div class="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div class="question" id="question">Cargando...</div>
  <div class="hintline" id="hintline"></div>
  
  <!-- RESPUESTAS DE TEXTO (solo para preguntas de opción múltiple) -->
  <div class="play-area" id="playArea"></div>
  
  <div class="feedback" id="feedback"></div>
  <div class="hud">
   <button class="tool-btn hint-tool" id="hintBtn"><span class="tool-icon"><svg viewBox="0 0 40 40"><circle cx="17" cy="17" r="10" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="m25 25 9 9" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></span><span class="tool-copy"><b>PISTA</b></span><strong class="tool-cost">25</strong></button>
   <button class="tool-btn skip-tool" id="skipBtn"><span class="tool-icon"><svg viewBox="0 0 40 40"><path d="M7 9v22l15-11L7 9Zm15 0v22l15-11L22 9Z" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/></svg></span><span class="tool-copy"><b>SALTAR</b></span><strong class="tool-cost">75</strong></button>
 </div>
</section>
</main>

<div class="modal" id="winModal"><div class="modal-card"><div class="win-kicker">MISIÓN COMPLETADA</div><div class="trophy">🏆</div><h2>¡Lo lograste!</h2><div class="win-reward"><b id="winReward">+10 focos</b></div><p id="winText">Has superado el desafío.</p><div class="modal-actions"><button class="primary" id="nextBtn">SIGUIENTE NIVEL ➜</button><button class="secondary" id="mapBtn">VOLVER AL MAPA</button></div></div></div>
<div class="toast" id="toast"></div>

<div class="update-modal" id="contentUpdateModal">
 <div class="update-card">
  <div class="update-kicker">ACTUALIZACIÓN</div>
  <h2>¡Hay contenido nuevo!</h2>
  <p id="updateVersion"></p>
  <ul id="updateChangelog"></ul>
  <div class="update-actions">
   <button class="update-primary" id="applyContentUpdate">ACTUALIZAR</button>
   <button class="update-later" id="laterContentUpdate">MÁS TARDE</button>
  </div>
 </div>
</div>
<script src="./game.js" defer></script>
</body>
</html>
